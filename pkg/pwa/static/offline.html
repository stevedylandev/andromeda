<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline</title>
  <meta name="theme-color" content="#121113">
  <style>
    /* Inline only: this page must render with zero network requests. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #121113;
      color: #e8e6e3;
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main { max-width: 34rem; text-align: center; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    p { font-size: 0.875rem; line-height: 1.6; color: #a8a5a1; margin-bottom: 0.75rem; }
    a { color: #e8e6e3; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page hasn't been visited while online, so it isn't available offline yet.</p>
    <p><a href="/">Go to the home page</a> &mdash; if you've visited it before, it will load from cache.</p>
  </main>
</body>
</html>
