name: Release Go

on:
  push:
    tags:
      - '*-go/v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Derive app + version
        id: app
        run: |
          tag="${GITHUB_REF_NAME}"
          app="${tag%%/*}"
          version="${tag#*/}"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "dir=apps/$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          # skip=validate: real git tag is "<app>-go/vX.Y.Z" but we pass
          # GORELEASER_CURRENT_TAG=vX.Y.Z so the validate-tag-at-HEAD check
          # fails. The push trigger already guarantees we're on a real tag.
          args: release --clean --skip=validate
          workdir: ${{ steps.app.outputs.dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.app.outputs.version }}
