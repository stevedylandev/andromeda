<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121113" />
    <link rel="stylesheet" href="/assets/darkmatter.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <title>Library | Quote</title>
  </head>
  <body>
    <div class="header">
      <a href="/" class="logo"><h1>LIBRARY</h1></a>
      <nav class="links">
        <a href="/quotes">quotes</a>
      </nav>
    </div>

    <article class="quote-page">
      <blockquote class="quote-page-title">{{.Quote.Quote}}</blockquote>
      {{if .Quote.Page}}<p class="quote-page-meta">p. {{.Quote.Page}}</p>{{end}}
      <p class="quote-page-meta">from <a href="/book/{{.Book.ID}}">{{.Book.Title}}</a> by {{.Book.Authors}}</p>
    </article>
  </body>
</html>
