{{define "base.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}{{.BlogTitle}}{{end}}</title>
  {{if .FaviconURL}}
    <link rel="apple-touch-icon" sizes="180x180" href="{{.FaviconURL}}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{.FaviconURL}}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{.FaviconURL}}">
  {{else}}
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
  {{end}}
  <meta name="theme-color" content="#121113" />
  {{block "meta" .}}{{end}}
  <link rel="stylesheet" href="/assets/darkmatter.css">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/custom-styles.css">
</head>
<body>
  {{if .HeaderHTML}}
  <div class="custom-header">
    {{.HeaderHTML}}
  </div>
  {{end}}
  <header class="header">
    <a href="/" class="logo">{{.BlogTitle}}</a>
    <nav class="links">
      {{range .NavLinks}}
        <a href="{{.URL}}">{{.Label}}</a>
      {{end}}
    </nav>
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
  <footer class="footer">
    {{.FooterHTML}}
  </footer>
  <script>
    document.querySelectorAll('.post-date').forEach(el => {
      const d = new Date(el.textContent.trim());
      if (!isNaN(d)) {
        const day = String(d.getDate()).padStart(2, '0');
        const mon = d.toLocaleString('en-US', { month: 'short' });
        el.textContent = `${day} ${mon}, ${d.getFullYear()}`;
      }
    });
  </script>
</body>
</html>{{end}}
