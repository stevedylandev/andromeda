services:
  app:
    build:
      context: ../..
      dockerfile: apps/jotts/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - JOTTS_PASSWORD=${JOTTS_PASSWORD:-changeme}
      - JOTTS_DB_PATH=/data/jotts.sqlite
      - COOKIE_SECURE=false
    volumes:
      - jotts-data:/data
    restart: unless-stopped

volumes:
  jotts-data:
