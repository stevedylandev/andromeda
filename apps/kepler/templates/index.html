{{define "index.html"}}{{template "base.html" .}}{{end}}
{{define "title"}}{{.SiteName}}{{end}}
{{define "content"}}
{{if .Repos}}
<table class="repo-list">
    <tbody>
        {{range .Repos}}
        <tr>
            <td><a href="/{{.Name}}">{{.Name}}</a></td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<p class="empty">No repositories found.</p>
{{end}}
{{end}}
