services:
  app:
    build:
      context: ../..
      dockerfile: apps/bookmarks/Dockerfile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - BOOKMARKS_PASSWORD=${BOOKMARKS_PASSWORD:-changeme}
      - BOOKMARKS_API_KEY=${BOOKMARKS_API_KEY:-}
      - BOOKMARKS_DB_PATH=/data/bookmarks.sqlite
      - COOKIE_SECURE=false
      - HOST=0.0.0.0
      - PORT=${PORT:-3000}
    volumes:
      - bookmarks-data:/data
    restart: unless-stopped

volumes:
  bookmarks-data:
