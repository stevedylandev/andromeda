<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121113" />
    <link rel="stylesheet" href="/assets/darkmatter.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <title>Bookmarks</title>
    <style>
      .category-heading {
        font-size: 14px;
        font-weight: 400;
        opacity: 0.5;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="/" class="logo">BOOKMARKS</a>
      <nav class="links">
        <a href="/admin">add</a>
      </nav>
    </div>

    {{if not .Groups}}
    <p class="empty">No categories yet.</p>
    {{else}}
    {{range .Groups}}
    <section>
      <h2 class="category-heading">{{.Name}}</h2>
      {{if not .Links}}
      <p class="empty">No links.</p>
      {{else}}
      <ul class="item-list">
        {{range .Links}}
        <li class="item">
          <a class="item-title" href="{{.URL}}" target="_blank" rel="noopener noreferrer">
            {{if .FaviconURL}}
            <img class="favicon" src="{{.FaviconURL}}" alt="" width="16" height="16" loading="lazy" />
            {{end}}
            {{.Title}}
          </a>
          <div class="item-meta">{{.URL}}</div>
        </li>
        {{end}}
      </ul>
      {{end}}
    </section>
    {{end}}
    {{end}}
  </body>
</html>
