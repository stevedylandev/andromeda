services:
  backup:
    build: .
    volumes:
      - jotts-data:/data/jotts:ro
      - sipp-data:/data/sipp:ro
      - cellar-data:/data/cellar:ro
      - posts-data:/data/posts:ro
      - feeds-data:/data/feeds:ro
      - library-data:/data/library:ro
      - bookmarks-data:/data/bookmarks:ro
      - parcels-data:/data/parcels:ro
      - easel-data:/data/easel:ro
    env_file: .env
    restart: unless-stopped

volumes:
  jotts-data:
    external: true
    name: ${JOTTS_VOLUME:-jotts_jotts-data}
  sipp-data:
    external: true
    name: ${SIPP_VOLUME:-sipp_sipp-data}
  cellar-data:
    external: true
    name: ${CELLAR_VOLUME:-cellar_cellar-data}
  posts-data:
    external: true
    name: ${POSTS_VOLUME:-posts_posts-data}
  feeds-data:
    external: true
    name: ${FEEDS_VOLUME:-feeds_feeds-data}
  library-data:
    external: true
    name: ${LIBRARY_VOLUME:-library_library-data}
  bookmarks-data:
    external: true
    name: ${BOOKMARKS_VOLUME:-bookmarks_bookmarks-data}
  parcels-data:
    external: true
    name: ${PARCELS_VOLUME:-parcels_parcels_data}
  easel-data:
    external: true
    name: ${EASEL_VOLUME:-easel_easel-data}
