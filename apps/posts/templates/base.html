<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ blog_title }}{% endblock %}</title>
  {% if !favicon_url.is_empty() %}
    <link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ favicon_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ favicon_url }}">
  {% else %}
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
  {% endif %}
  <meta name="theme-color" content="#121113" />
  {% block meta %}{% endblock %}
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/custom-styles.css">
</head>
<body>
  <header class="header">
    <a href="/" class="logo">{{ blog_title }}</a>
    <nav class="links">
      {% for link in nav_links %}
        <a href="{{ link.url }}">{{ link.label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <a href="/feed.xml" class="rss-link" title="RSS Feed">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="3.429" cy="20.571" r="3.429"/>
        <path d="M11.429 24h4.57C15.999 15.179 8.821 8.001 0 8.001v4.57c6.297 0 11.429 5.132 11.429 11.429z"/>
        <path d="M19.999 24C19.999 10.767 9.233 0 0 0v4.571c10.714 0 15.428 8.714 15.428 19.429h4.571z"/>
      </svg>
      RSS
    </a>
  </footer>
</body>
</html>
